name: Test Project

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            second-action-react-jswebapp

      - name: Build Docker image
        run: docker build -t second-action-react-jswebapp .

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-container second-action-react-jswebapp

      - name: Wait for app to start
        run: sleep 5

      - name: Check if app responds
        run: curl --fail http://localhost:8080 || exit 1

      - name: Stop container
        if: always()
        run: docker stop test-container