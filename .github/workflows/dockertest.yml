name: Test Project

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Get code
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            second-action-react-jswebapp
      - name: Install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '24.19.0'
      - name: Install dependencies
        run: npm ci --prefix second-action-react-jswebapp
      - name: Run tests
        run: npm test --prefix second-action-react-jswebapp
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            second-action-react-jswebapp

      - name: Install dependencies
        run: npm install
        working-directory: ./second-action-react-jswebapp

      - name: Run security audit
        run: npm audit --audit-level=high
        working-directory: ./second-action-react-jswebapp
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t second-action-react-jswebapp ./second-action-react-jswebapp

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-container second-action-react-jswebapp

      - name: Wait for app to start
        run: sleep 5

      - name: Check if app responds
        run: curl --fail http://localhost:8080 || exit 1

      - name: Stop container
        if: always()
        run: docker stop test-container